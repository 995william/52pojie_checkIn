name: 吾爱破解自动签到

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin_job:
    name: 吾爱破解签到任务
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装项目依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行吾爱破解自动签到与中枢上报
        env:
          POJIE52_COOKIE: ${{ secrets.POJIE52_COOKIE }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          CHECKIN_HUB_URL: "https://checkin.wwcoder.top"
          CHECKIN_HUB_TOKEN: ${{ secrets.CHECKIN_HUB_TOKEN }}
          HUB_MANAGED_NOTIFY: "true"
          MSG_TEMPLATE: ${{ vars.MSG_TEMPLATE || '1' }}
        run: |
          python main.py
